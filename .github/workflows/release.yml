name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release source
        run: |
          python3 -m pip install Pillow==12.3.0
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -v
          git diff --check
      - name: Plan release
        id: plan
        uses: wgtechlabs/release-build-flow-action@6df9cb42c24c296d902150d051a0b6be4422cccc # v1
        with:
          initial-version: 0.1.0
          dry-run: true
          changelog-enabled: false
          sync-version-files: false
          commit-convention: clean-commit
      - name: Synchronize plugin versions
        if: steps.plan.outputs.version-bump-type != 'none'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          for folder in ('.claude-plugin', '.codex-plugin'):
              path = Path(folder) / 'plugin.json'
              plugin = json.loads(path.read_text())
              plugin['version'] = os.environ['RELEASE_VERSION']
              path.write_text(json.dumps(plugin, indent=2) + '\n')
          PY
          python3 scripts/validate.py
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json
      - name: Publish release
        if: steps.plan.outputs.version-bump-type != 'none'
        uses: wgtechlabs/release-build-flow-action@6df9cb42c24c296d902150d051a0b6be4422cccc # v1
        with:
          planned-version: ${{ steps.plan.outputs.version }}
          planned-version-tag: ${{ steps.plan.outputs.version-tag }}
          planned-version-bump-type: ${{ steps.plan.outputs.version-bump-type }}
          planned-previous-version: ${{ steps.plan.outputs.previous-version }}
          sync-version-files: false
          changelog-path: ./CHANGELOG.md
          commit-changelog: true
          commit-convention: clean-commit
          create-release: true
